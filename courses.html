<title>KLiC | Courses</title>
<style>
    :root {
        --blue: #0A66C2;
        --blue-dark: #084d94;
        --light-blue: #E6F2FB;
        --light-blue-2: #F4F9FD;
        --red: #ED2553;
        --red-dark: #c41a41;
        --light-red: #fdeaef;
        --orange: #F68029;
        --orange-dark: #d4651a;
        --light-orange: #fef0e6;
        --text: #1A2A3A;
        --text-soft: #5A6B7C;
        --border: #DCE7F1;
        --white: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: var(--text);
        background: var(--white);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        font-size: 16px;
    }

    a { color: var(--blue); text-decoration: none; transition: color 0.2s ease; }
    a:hover { color: var(--blue-dark); }

    .container { max-width: 1140px; margin: 0 auto; padding: 0 24px; }

    /* Header */
    header {
        position: sticky;
        top: 0;
        background: rgba(255,255,255,0.95);
        backdrop-filter: saturate(180%) blur(10px);
        border-bottom: 1px solid var(--border);
        z-index: 100;
    }

    .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 68px;
    }

    .logo {
        font-weight: 700;
        font-size: 22px;
        color: var(--blue);
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
    }

    .logo img { height: 40px; width: auto; display: block; }

    .logo span {
        color: var(--text);
        font-weight: 400;
        font-size: 14px;
        margin-left: 8px;
        letter-spacing: 0;
    }

    .nav-links {
        display: flex;
        gap: 28px;
        list-style: none;
        align-items: center;
    }

    .nav-links a { color: var(--text); font-size: 14.5px; font-weight: 500; }
    .nav-links a:hover { color: var(--blue); }
    .nav-links a.btn-primary { color: var(--white); }
    .nav-links a.btn-primary:hover { color: var(--white); }

    .btn {
        display: inline-block;
        padding: 10px 22px;
        border-radius: 8px;
        font-size: 14.5px;
        font-weight: 600;
        transition: all 0.2s ease;
        border: none;
        cursor: pointer;
    }

    .btn-primary { background: linear-gradient(120deg, var(--red) 0%, var(--orange) 100%); color: var(--white); }
    .btn-primary:hover { background: linear-gradient(120deg, var(--red-dark) 0%, var(--orange-dark) 100%); color: var(--white); transform: translateY(-1px); }
    .btn-outline { background: transparent; color: var(--blue); border: 1.5px solid var(--blue); }
    .btn-outline:hover { background: var(--light-blue); color: var(--blue); }

    .hamburger {
        display: none;
        background: none;
        border: none;
        cursor: pointer;
        padding: 8px;
        flex-direction: column;
        gap: 5px;
    }
    .hamburger span { display: block; width: 22px; height: 2px; background: var(--text); border-radius: 2px; }

    /* Page hero */
    .page-hero {
        background: linear-gradient(160deg, var(--light-blue-2) 0%, #fff5f7 50%, var(--light-orange) 100%);
        padding: 64px 0 48px;
        border-bottom: 1px solid var(--border);
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-soft);
        margin-bottom: 24px;
        transition: color 0.2s;
    }
    .back-link:hover { color: var(--blue); }
    .back-link::before { content: "←"; font-size: 16px; }

    .page-hero-inner { display: flex; align-items: flex-start; gap: 20px; }

    .track-hero-icon {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: var(--light-blue);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        flex-shrink: 0;
    }

    .page-hero h1 {
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -0.8px;
        line-height: 1.2;
        margin-bottom: 10px;
    }

    .page-hero p {
        font-size: 16px;
        color: var(--text-soft);
        max-width: 600px;
    }

    .course-count-badge {
        display: inline-block;
        background: var(--light-red);
        color: var(--red);
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 12px;
    }

    /* Courses grid */
    .courses-section { padding: 64px 0 88px; }

    .courses-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
    }

    .course-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px 24px;
        transition: all 0.25s ease;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .course-card:hover {
        border-color: var(--blue);
        transform: translateY(-3px);
        box-shadow: 0 12px 32px rgba(10, 102, 194, 0.08);
    }

    .course-card-icon {
        width: 44px;
        height: 44px;
        border-radius: 11px;
        background: var(--light-blue);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        margin-bottom: 4px;
    }

    .course-card h3 {
        font-size: 15.5px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.35;
    }

    .course-card .course-tag {
        display: inline-block;
        background: var(--light-blue-2);
        color: var(--text-soft);
        font-size: 12px;
        font-weight: 500;
        padding: 3px 10px;
        border-radius: 6px;
        margin-top: 4px;
        width: fit-content;
    }

    .enroll-link {
        margin-top: auto;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--red);
    }
    .enroll-link::after { content: " →"; }
    .enroll-link:hover { color: var(--red-dark); }

    /* Empty state */
    .empty-state {
        text-align: center;
        padding: 80px 24px;
        color: var(--text-soft);
    }
    .empty-state h3 { font-size: 22px; font-weight: 600; margin-bottom: 10px; color: var(--text); }

    /* Track switcher */
    .track-switcher {
        background: var(--light-blue-2);
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    .track-tabs {
        display: flex;
        gap: 4px;
        padding: 12px 24px;
        max-width: 1140px;
        margin: 0 auto;
        white-space: nowrap;
    }

    .track-tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-soft);
        background: transparent;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
    }
    .track-tab:hover { background: var(--light-red); color: var(--red); }
    .track-tab.active { background: linear-gradient(120deg, var(--red), var(--orange)); color: var(--white); font-weight: 600; }

    /* Mobile */
    @media (max-width: 860px) {
        .nav-links {
            display: none;
            position: absolute;
            top: 68px;
            left: 0;
            right: 0;
            background: var(--white);
            flex-direction: column;
            gap: 0;
            padding: 12px 24px 20px;
            border-bottom: 1px solid var(--border);
        }
        .nav-links.open { display: flex; }
        .nav-links li { width: 100%; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .nav-links li:last-child { border-bottom: none; padding-top: 14px; }
        .hamburger { display: flex; }
        .page-hero h1 { font-size: 26px; }
        .courses-grid { grid-template-columns: 1fr; }
    }
</style>

// ─── Helpers ─────────────────────────────────────────────────────────────────
function slugToTitle(slug) {
    return slug
        .replace(/-/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase())
        .replace(/\bAi\b/g, 'AI')
        .replace(/\bMl\b/g, 'ML')
        .replace(/\bIot\b/g, 'IoT')
        .replace(/\bMs\b/g, 'MS')
        .replace(/\bDtp\b/g, 'DTP')
        .replace(/\bVfx\b/g, 'VFX')
        .replace(/\bOop\b/g, 'OOP')
        .replace(/\bGst\b/g, 'GST')
        .replace(/\bPhp\b/g, 'PHP')
        .replace(/\bSql\b/g, 'SQL')
        .replace(/\bDbms\b/g, 'DBMS')
        .replace(/\bVba\b/g, 'VBA')
        .replace(/\bHtml\b/g, 'HTML')
        .replace(/\bCss\b/g, 'CSS');
}

// ─── Render ───────────────────────────────────────────────────────────────────
function getActiveTrack() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('track');
    return tracks.find(t => t.id === id) || tracks[0];
}

function renderTabs(active) {
    const container = document.getElementById('trackTabs');
    container.innerHTML = tracks.map(t => `
        <button class="track-tab ${t.id === active.id ? 'active' : ''}"
                onclick="switchTrack('${t.id}')">
            <span>${t.icon}</span>${t.name}
        </button>
    `).join('');
}

function renderHero(track) {
    document.title = `KLiC | ${track.name} Courses`;
    document.getElementById('heroIcon').textContent = track.icon;
    document.getElementById('heroTitle').textContent = track.name;
    document.getElementById('heroDesc').textContent = track.desc;
    document.getElementById('courseCountBadge').textContent = `${track.courses.length} Courses`;
}

function renderCourses(track) {
    const grid = document.getElementById('coursesGrid');
    if (!track.courses.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
            <h3>Coming soon</h3>
            <p>Courses for this track are being added. Check back shortly.</p>
        </div>`;
        return;
    }
    grid.innerHTML = track.courses.map(c => `
        <div class="course-card">
            <div class="course-card-icon">${track.icon}</div>
            <h3>${c.name}</h3>
            <span class="course-tag">${track.name}</span>
            <a class="enroll-link" href="enroll.html">Enroll Now</a>
        </div>
    `).join('');
}

function switchTrack(id) {
    const url = new URL(window.location.href);
    url.searchParams.set('track', id);
    window.history.pushState({}, '', url);
    init();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function init() {
    const active = getActiveTrack();
    renderTabs(active);
    renderHero(active);
    renderCourses(active);
}

init();

// Hamburger
document.getElementById('hamburger').addEventListener('click', () => {
    document.getElementById('navLinks').classList.toggle('open');
});
